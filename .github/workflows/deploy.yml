name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the deploy line
        run: |
          start=$(date +%s)
          sha_short="${GITHUB_SHA::7}"
          stamped_at=$(date -u +"%Y-%m-%d %H:%M UTC")
          # Build duration is measured at the end; placeholder swapped below.
          elapsed=$(( $(date +%s) - start ))
          stamp="last deploy: ${sha_short} · ${stamped_at} · built in ${elapsed}s"
          # Escape for sed, then replace the marker in place.
          esc=$(printf '%s' "$stamp" | sed -e 's/[\/&]/\\&/g')
          sed -i "s/<!--DEPLOY_STAMP-->/${esc}/" index.html
          echo "Stamped: $stamp"

      - name: Verify the marker was replaced
        run: |
          if grep -q "DEPLOY_STAMP" index.html; then
            echo "::error::deploy stamp marker was not replaced"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
